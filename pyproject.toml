[project]
name = "se-skills"
version = "0.1.0"
description = "Evaluation framework and development tooling for the SE Skills Suite."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "fastapi>=0.100",
    "markdown>=3.5",
    "nh3>=0.2.22",
    "keyring>=25.0",
    "httpx>=0.28.1",
    "reportlab>=4.0",
    "numpy>=1.24",
    "requests>=2.31",
    "python-dateutil>=2.8",
    "asyncpg>=0.30.0",
    "pyjwt[crypto]>=2.10.0",
    "testcontainers[postgres]>=4.0.0",
    "pytest-asyncio>=0.23",
    "python-multipart>=0.0.12",
    "uvicorn>=0.30.0",
    # Ask feature (AskService) quick path: SSE streaming + the Anthropic SDK.
    # `webapp/app.py`'s own PEP 723 inline script header already declares
    # these for `uv run app.py`, but that's a SEPARATE ephemeral environment
    # from this project's .venv — anyone running the app any other way
    # (`-m uvicorn app:app`, or importing webapp.app from pytest) needs them
    # declared here too, or the quick path 500s with ModuleNotFoundError the
    # first time someone actually asks a quick-path question (the import is
    # lazy, inside the request handler, so the server looks healthy until then).
    "sse-starlette>=2.0",
    "anthropic>=0.40",
]
hosted = [
    "asyncpg>=0.30.0",
    "pyjwt[crypto]>=2.10.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.12",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.30.0",
    # The hosted reader, review preview, and export all render Markdown through
    # `md_render` (markdown + nh3 sanitizer); hosted PDF export renders in-process
    # with reportlab instead of the local headless-Chrome pipeline.
    "markdown>=3.5",
    "nh3>=0.2.22",
    "reportlab>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["eval"]
pythonpath = [".", "webapp", "skills/worker-analysis/worker_analysis", "skills/worker-analysis/worker_analysis/src"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
markers = [
    "model_dependent: tests that invoke a language model (skipped by default)",
    "slow: tests that take more than a few seconds",
    "hosted: tests that require a Postgres container",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
