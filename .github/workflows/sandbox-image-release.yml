name: Release sandbox image

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type BUILD_SANDBOX_IMAGE to authorize a release"
        required: true
        type: string
      registry:
        description: "Container registry hostname"
        required: true
        default: ghcr.io
        type: string
      image:
        description: "Repository/image name"
        required: true
        default: ${{ github.repository }}/se-skills-sandbox
        type: string
      tag:
        description: "Immutable release tag"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  release:
    if: ${{ inputs.confirm == 'BUILD_SANDBOX_IMAGE' }}
    runs-on: ubuntu-latest
    environment: sandbox-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pinned build tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools" "$RUNNER_TEMP/bin"
          for tool in syft grype cosign; do
            version="$(python3 -c 'import json,sys; print(json.load(open("deploy/pins.json"))["build_tools"][sys.argv[1]]["version"])' "$tool")"
            filename="$(python3 -c 'import json,sys; print(json.load(open("deploy/pins.json"))["build_tools"][sys.argv[1]]["filename"])' "$tool")"
            checksum="$(python3 -c 'import json,sys; print(json.load(open("deploy/pins.json"))["build_tools"][sys.argv[1]]["sha256"])' "$tool")"
            case "$tool" in
              syft|grype) owner=anchore ;;
              cosign) owner=sigstore ;;
            esac
            archive="$RUNNER_TEMP/$filename"
            curl --fail --location --silent --show-error \
              "https://github.com/$owner/$tool/releases/download/v$version/$filename" \
              --output "$archive"
            printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check
          done
          tar -xzf "$RUNNER_TEMP/syft_1.20.0_linux_amd64.tar.gz" -C "$RUNNER_TEMP/tools" syft
          tar -xzf "$RUNNER_TEMP/grype_0.84.0_linux_amd64.tar.gz" -C "$RUNNER_TEMP/tools" grype
          cp "$RUNNER_TEMP/cosign-linux-amd64" "$RUNNER_TEMP/tools/cosign"
          mv "$RUNNER_TEMP/tools/cosign-linux-amd64" "$RUNNER_TEMP/tools/cosign"
          chmod 0755 "$RUNNER_TEMP/tools/"*
          ln -s "$RUNNER_TEMP/tools/syft" "$RUNNER_TEMP/bin/syft"
          ln -s "$RUNNER_TEMP/tools/grype" "$RUNNER_TEMP/bin/grype"
          ln -s "$RUNNER_TEMP/tools/cosign" "$RUNNER_TEMP/bin/cosign"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Authenticate to GitHub Container Registry
        if: ${{ inputs.registry == 'ghcr.io' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and verify sandbox image
        env:
          IMAGE: ${{ inputs.registry }}/${{ inputs.image }}
          TAG: ${{ inputs.tag }}
          PUBLISH: "1"
          COSIGN_SIGN: "1"
        run: ./deploy/images/build_sandbox_image.sh

      - name: Retain release evidence
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: sandbox-release-evidence
          path: deploy/images/out/*
          if-no-files-found: error
