name: Release sandbox image

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type BUILD_SANDBOX_IMAGE to authorize a release"
        required: true
        type: string
      registry:
        description: "Container registry hostname"
        required: true
        default: ghcr.io
        type: string
      image:
        description: "Repository/image name"
        required: true
        default: ${{ github.repository }}/se-skills-sandbox
        type: string
      tag:
        description: "Immutable release tag"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  release:
    if: ${{ inputs.confirm == 'BUILD_SANDBOX_IMAGE' }}
    runs-on: ubuntu-latest
    environment: sandbox-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pinned build tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools" "$RUNNER_TEMP/bin"
          wget -qO "$RUNNER_TEMP/syft.tgz" \
            https://github.com/anchore/syft/releases/download/v1.20.0/syft_1.20.0_linux_amd64.tar.gz
          wget -qO "$RUNNER_TEMP/grype.tgz" \
            https://github.com/anchore/grype/releases/download/v0.84.0/grype_0.84.0_linux_amd64.tar.gz
          wget -qO "$RUNNER_TEMP/cosign.tgz" \
            https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/syft.tgz" -C "$RUNNER_TEMP/tools" syft
          tar -xzf "$RUNNER_TEMP/grype.tgz" -C "$RUNNER_TEMP/tools" grype
          tar -xzf "$RUNNER_TEMP/cosign.tgz" -C "$RUNNER_TEMP/tools" cosign-linux-amd64
          mv "$RUNNER_TEMP/tools/cosign-linux-amd64" "$RUNNER_TEMP/tools/cosign"
          chmod 0755 "$RUNNER_TEMP/tools/"*
          ln -s "$RUNNER_TEMP/tools/syft" "$RUNNER_TEMP/bin/syft"
          ln -s "$RUNNER_TEMP/tools/grype" "$RUNNER_TEMP/bin/grype"
          ln -s "$RUNNER_TEMP/tools/cosign" "$RUNNER_TEMP/bin/cosign"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Authenticate to GitHub Container Registry
        if: ${{ inputs.registry == 'ghcr.io' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and verify sandbox image
        env:
          IMAGE: ${{ inputs.registry }}/${{ inputs.image }}
          TAG: ${{ inputs.tag }}
          PUBLISH: "1"
          COSIGN_SIGN: "1"
        run: ./deploy/images/build_sandbox_image.sh
