name: Release sandbox image

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type BUILD_SANDBOX_IMAGE to authorize a release"
        required: true
        type: string
      registry:
        description: "Container registry hostname"
        required: true
        default: ghcr.io
        type: string
      image:
        description: "Repository/image name"
        required: true
        default: ${{ github.repository }}/se-skills-sandbox
        type: string
      tag:
        description: "Immutable release tag"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  release:
    if: ${{ inputs.confirm == 'BUILD_SANDBOX_IMAGE' }}
    runs-on: ubuntu-latest
    environment: sandbox-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --user uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Authenticate to GitHub Container Registry
        if: ${{ inputs.registry == 'ghcr.io' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and verify sandbox image
        env:
          IMAGE: ${{ inputs.registry }}/${{ inputs.image }}
          TAG: ${{ inputs.tag }}
        run: ./deploy/images/build_sandbox_image.sh

      - name: Publish verified image
        env:
          IMAGE: ${{ inputs.registry }}/${{ inputs.image }}
          TAG: ${{ inputs.tag }}
        run: docker push "${IMAGE}:${TAG}"
