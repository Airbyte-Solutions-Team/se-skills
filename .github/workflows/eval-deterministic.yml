name: Deterministic evaluation suite

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Run deterministic evaluation tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Install pinned actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        run: |
          set -euo pipefail
          mkdir -p .tools
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/actionlint.tar.gz
          printf '%s  %s\n' "$ACTIONLINT_SHA256" /tmp/actionlint.tar.gz | sha256sum --check --status
          tar --extract --file /tmp/actionlint.tar.gz --directory .tools actionlint
          chmod 0755 .tools/actionlint

      - name: Lint all workflow files
        run: ACTIONLINT_BIN="$PWD/.tools/actionlint" ./scripts/check-workflows.sh

      - name: Diagnose broker lifecycle privilege paths
        run: |
          set +e
          sysctl kernel.apparmor_restrict_unprivileged_userns
          unshare --map-root-user --mount --fork true
          echo "unshare_userns_exit=$?"
          sudo --non-interactive unshare --mount --fork true
          echo "sudo_root_mount_exit=$?"

      - name: Run pytest
        run: uv run --extra dev pytest eval/ -v -rs --junitxml=/tmp/eval-junit.xml

      - name: Require real broker lifecycle coverage
        run: |
          uv run python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("/tmp/eval-junit.xml").getroot()
          cases = [
              case
              for case in root.iter("testcase")
              if "test_runsc_broker_lifecycle" in case.attrib.get("classname", "")
          ]
          executed = [
              case
              for case in cases
              if case.find("skipped") is None
          ]
          if not cases:
              raise SystemExit("broker lifecycle test file collected no tests")
          if not executed:
              raise SystemExit(
                  "broker lifecycle test file collected tests but executed none"
              )
          print(f"broker lifecycle cases: {len(executed)} executed")
          PY

      - name: Run mock evaluation suite
        run: uv run python -m eval.runner run-suite --manifest-dir eval/manifests/phase1 --executor mock

      - name: Upload evaluation reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: eval/results/
          if-no-files-found: ignore
