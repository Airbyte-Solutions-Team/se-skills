---
- name: Install hosted worker systemd unit
  ansible.builtin.template:
    src: se-skills-worker.service.j2
    dest: "/etc/systemd/system/{{ hosted_service_unit }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart hosted worker

- name: Enable hosted worker
  ansible.builtin.systemd:
    name: "{{ hosted_service_unit }}"
    enabled: true
    state: started
    daemon_reload: true
