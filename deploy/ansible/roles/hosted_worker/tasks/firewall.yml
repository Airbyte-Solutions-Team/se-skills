---
- name: Install deny-by-default firewall policy
  ansible.builtin.template:
    src: firewall.nft.j2
    dest: "{{ hosted_firewall_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Validate rendered firewall policy
  ansible.builtin.command:
    argv:
      - nft
      - --check
      - -f
      - "{{ hosted_firewall_path }}"
  changed_when: false

- name: Apply rendered firewall policy atomically
  ansible.builtin.command:
    argv:
      - nft
      - -f
      - "{{ hosted_firewall_path }}"
  when: not ansible_check_mode
  changed_when: true

- name: Install persistent hosted firewall unit
  ansible.builtin.template:
    src: se-skills-firewall.service.j2
    dest: "/etc/systemd/system/{{ hosted_firewall_unit }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable persistent hosted firewall unit
  ansible.builtin.systemd:
    name: "{{ hosted_firewall_unit }}"
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode
