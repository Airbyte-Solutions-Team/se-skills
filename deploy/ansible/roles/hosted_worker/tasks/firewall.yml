---
- name: Install deny-by-default firewall policy
  ansible.builtin.template:
    src: firewall.nft.j2
    dest: "{{ hosted_firewall_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Validate rendered firewall policy
  ansible.builtin.command:
    argv:
      - nft
      - --check
      - -f
      - "{{ hosted_firewall_path }}"
  changed_when: false

- name: Apply rendered firewall policy atomically
  ansible.builtin.command:
    argv:
      - nft
      - -f
      - "{{ hosted_firewall_path }}"
  when: not ansible_check_mode
  changed_when: true

- name: Require nftables service
  ansible.builtin.service:
    name: nftables
    enabled: true
    state: started
