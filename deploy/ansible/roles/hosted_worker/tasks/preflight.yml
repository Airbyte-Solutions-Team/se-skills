---
- name: Load authoritative deployment pins
  ansible.builtin.set_fact:
    hosted_pins: "{{ lookup('ansible.builtin.file', hosted_pins_file) | from_json }}"

- name: Require address literals for firewall destinations
  ansible.builtin.assert:
    that:
      - item.value == "" or item.value is match("^[0-9A-Fa-f:.]+(/[0-9]{1,3})?$")
    fail_msg: "Firewall destination variables must be IP addresses or CIDRs."
  loop:
    - { name: database, value: "{{ hosted_database_host }}" }
    - { name: storage, value: "{{ hosted_storage_host }}" }
    - { name: registry, value: "{{ hosted_registry_host }}" }
    - { name: observability, value: "{{ hosted_observability_host }}" }
    - { name: anthropic_proxy, value: "{{ hosted_anthropic_proxy_host }}" }

- name: Require address literals for DNS and NTP destinations
  ansible.builtin.assert:
    that:
      - item is match("^[0-9A-Fa-f:.]+(/[0-9]{1,3})?$")
    fail_msg: "DNS and NTP firewall destinations must be IP addresses or CIDRs."
  loop: "{{ hosted_dns_servers + hosted_ntp_servers }}"

- name: Require supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts.system == "Linux"
      - ansible_facts.distribution == "Ubuntu"
      - ansible_facts.distribution_version is version(hosted_pins.host.os_version, "==")
      - ansible_facts.architecture in hosted_pins.runsc.sha512
    fail_msg: "Host does not satisfy the pinned Ubuntu/architecture contract."

- name: Require supported pinned architecture
  ansible.builtin.assert:
    that:
      - ansible_facts.architecture in hosted_pins.runsc.sha512
      - hosted_pins.host.arch == ansible_facts.architecture
    fail_msg: "No runsc checksum pin exists for this architecture."
