---
- name: Ensure journald is used for worker logs
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/se-skills-worker.conf
    content: |
      [Journal]
      SystemMaxUse=1G
      MaxRetentionSec=30day
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-journald
