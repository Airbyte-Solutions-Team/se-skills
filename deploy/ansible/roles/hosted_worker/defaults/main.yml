---
hosted_repo_root: /opt/se-skills
hosted_pins_file: "{{ role_path }}/../../../pins.json"
hosted_worker_user: se-worker
hosted_worker_group: se-worker
hosted_remove_user: false
hosted_app_dir: /opt/se-skills
hosted_rootfs_dir: /opt/se-skills/rootfs
hosted_state_dir: /var/lib/se-skills
hosted_runsc_state_dir: /var/lib/se-skills/runsc
hosted_runsc_staging_dir: /var/lib/se-skills/runsc-staging
hosted_runsc_workspace_dir: /var/lib/se-skills/workspaces
hosted_runsc_journal_dir: /var/lib/se-skills/runsc-journal
hosted_bundle_dir: /var/lib/se-skills/bundles
hosted_env_file: /etc/se-skills/worker.env
hosted_firewall_path: /etc/se-skills/firewall.nft
hosted_operator_ssh_cidr: ""
hosted_operator_ssh_port: 22
hosted_anthropic_proxy_host: ""
hosted_anthropic_proxy_port: 3128
hosted_database_host: ""
hosted_storage_host: ""
hosted_registry_host: ""
hosted_observability_host: ""
hosted_dns_servers: []
hosted_ntp_servers: []
hosted_postgres_port: 5432
hosted_storage_port: 443
hosted_registry_port: 443
hosted_observability_port: 443
hosted_runsc_binary: /usr/local/bin/runsc
hosted_runsc_helper: /usr/local/sbin/se-skills-runsc
hosted_runsc_broker_config: /etc/se-skills/runsc-broker.json
hosted_runsc_sudoers: /etc/sudoers.d/se-skills-runsc
hosted_venv_dir: /opt/se-skills/venv
hosted_broker_import_paths: []
hosted_broker_max_request_bytes: 1048576
hosted_broker_request_read_timeout_seconds: 5
hosted_broker_max_string_length: 8192
hosted_broker_max_collection_length: 256
hosted_broker_max_nesting_depth: 16
hosted_broker_max_concurrent_operations: 4
hosted_broker_max_attempt_duration_seconds: 900
hosted_broker_operation_timeout_seconds: 30
hosted_worker_requirements: /opt/se-skills/deploy/requirements-worker.txt
hosted_worker_uid: 995
hosted_worker_gid: 995
hosted_service_unit: se-skills-worker.service
hosted_cleanup_unit: se-skills-cleanup.service
hosted_cleanup_timer: se-skills-cleanup.timer
hosted_cleanup_min_age_minutes: 60
hosted_firewall_unit: se-skills-firewall.service
hosted_runtime_directory: /run/se-skills
hosted_app_entrypoint: /opt/se-skills/scripts/run_hosted_worker.py
