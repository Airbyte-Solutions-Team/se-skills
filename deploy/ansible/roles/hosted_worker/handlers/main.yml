---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart hosted worker
  ansible.builtin.systemd:
    name: "{{ hosted_service_unit }}"
    state: restarted

- name: Reload nftables
  ansible.builtin.command:
    argv:
      - nft
      - delete
      - table
      - inet
      - se_skills
  failed_when: false
  changed_when: false
  listen: Reload nftables

- name: Load SE Skills nftables table
  ansible.builtin.command:
    argv:
      - nft
      - -f
      - "{{ hosted_firewall_path }}"
  changed_when: false
  listen: Reload nftables

- name: Restart systemd-journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
