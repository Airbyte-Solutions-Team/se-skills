---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart hosted worker
  ansible.builtin.systemd:
    name: "{{ hosted_service_unit }}"
    state: restarted

- name: Reload nftables
  ansible.builtin.command:
    argv:
      - nft
      - -f
      - "{{ hosted_firewall_path }}"
  changed_when: false

- name: Restart systemd-journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
